<div class="br" id="br">
  <p class="titulo">Banco Registros</p>
  <table>
    <thead>
      <tr>
        <th>Índice</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let registro of registros; let i = index">
        <td>{{ registrosNombres[i] }}</td>
        <td>{{ registro }}</td>
      </tr>
    </tbody>
  </table>
</div>
